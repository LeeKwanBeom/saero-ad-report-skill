<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>변경 이력 관리 (시험용 가짜 화면)</title>
<style>
  body{font-family:sans-serif;margin:16px}
  table{border-collapse:collapse} td,th{border:1px solid #ccc;padding:4px 8px}
  button{margin:2px}
</style>
</head>
<body>
<!--
  tests/test_fetch_reports.py 전용 가짜 화면(2026-10-12 추가 수집 B). 광고주센터 도구 › 변경 이력 관리의 문구·흐름만 흉내 낸다(탐색 전문 2-3 · 사용자 캡처 11·18):
  기간 `YYYY.MM.DD. → YYYY.MM.DD.`(기본 = 오늘 포함 30일) · 필터 · `검색하기` · 표 위 `⤓ 다운로드` · `열 맞춤 설정`. 다운로드는 같은 폴더의 엑셀 파일을
  `이력 목록 YYYYMMDD HHMM.xlsx` 이름으로 받게 한다(형식 고르는 창 없음 — 사용자 실측). `검색하기`·`열 맞춤 설정`·필터를 누르면 화면이 FORBIDDEN_CLICKED 로 바뀐다
  (코드는 `다운로드` 하나만 누른다). 쿼리: today=YYYY-MM-DD · hxlsx=<파일 이름>(기본 history-sample.xlsx) · hnodl=1(눌러도 다운로드 안 됨) ·
  hold=1(기간 끝이 어제 — 주소에 기간이 붙은 경우 재현) · hdup=1(`다운로드` 버튼 하나 더). 로그인 상태는 localStorage `saero_fixture_login`(목록 가짜 화면과 같음).
  config history.url 은 쿼리를 받지 않으므로(extras 설정 검사) 시험은 이 쿼리를 **목록 가짜 화면 주소**에 붙이고, 이 화면은 그것(localStorage `saero_fixture_q`)을 읽는다.
-->
<div id="hist">
  <h1>변경 이력 관리</h1>
  <div>
    <span id="period"></span> <button id="calendar" aria-label="달력">📅</button>
    <select id="type"><option>모든 변경</option><option>캠페인</option><option>광고그룹</option></select>
    <input id="target" placeholder="대상 ID">
    <button id="search">검색하기</button>
  </div>
  <div>
    <button id="dl">⤓ 다운로드</button> <button id="cols">열 맞춤 설정</button> <span id="dup"></span>
  </div>
  <table>
    <thead><tr><th>변경일자</th><th>변경 유형</th><th>변경자</th><th>캠페인</th><th>광고그룹</th><th>변경 내용</th></tr></thead>
    <tbody><tr><td colspan="6">(표 — 시험용)</td></tr></tbody>
  </table>
</div>
<script>
(function(){
  if (localStorage.getItem("saero_fixture_login") !== "1") {
    location.replace("login.html" + location.search);
    return;
  }
  const q = new URLSearchParams(location.search || localStorage.getItem("saero_fixture_q") || "");   // 주소에 쿼리가 없으면 목록 가짜 화면이 적어 둔 쿼리
  const TODAY = q.get("today") ? new Date(q.get("today") + "T00:00:00") : new Date("2026-09-28T00:00:00");
  const pad = n => String(n).padStart(2, "0");
  const f = d => `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}.`;
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
  const end = q.get("hold") === "1" ? addDays(TODAY, -1) : TODAY;
  document.getElementById("period").textContent = f(addDays(end, -29)) + " → " + f(end);
  ["search", "cols", "calendar"].forEach(id => document.getElementById(id).addEventListener("click", ev => {
    document.body.innerHTML = "<h1>FORBIDDEN_CLICKED " + ev.target.textContent + "</h1>";
  }));
  function download() {
    if (q.get("hnodl") === "1") return;
    const a = document.createElement("a");
    a.href = q.get("hxlsx") || "history-sample.xlsx";
    a.download = `이력 목록 ${TODAY.getFullYear()}${pad(TODAY.getMonth()+1)}${pad(TODAY.getDate())} 0130.xlsx`;
    document.body.appendChild(a); a.click(); a.remove();
  }
  document.getElementById("dl").addEventListener("click", download);
  if (q.get("hdup") === "1") {
    const b = document.createElement("button"); b.textContent = "다운로드"; b.addEventListener("click", download);
    document.getElementById("dup").appendChild(b);
  }
})();
</script>
</body>
</html>
